[package]
name = "oracle_audit_file_collector"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
glob = "0.3"
quick-xml = "0.31"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "tls-native-tls"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
